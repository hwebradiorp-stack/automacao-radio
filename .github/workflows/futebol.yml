name: Live Futebol H WebRadio

on:
  schedule:
    # Quarta-feira (21:20 BRT) -> Quinta-feira 00:20 UTC
    - cron: '20 0 * * 4'

    # Domingo (15:45 BRT) -> Domingo 18:45 UTC
    - cron: '45 18 * * 0'

  workflow_dispatch: # Botão para disparar manualmente na hora que quiser

jobs:
  retransmitir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Iniciar Script Python
        run: python3 retransmitir_futebol.py
